[package]
name = "zdmusic"
version = "0.1.0"
description = "卓动悦听 - AI-powered Bilibili audio player"
authors = ["zuodong"]
license = "CC-BY-NC-SA-4.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
rfd = { version = "0.15", features = ["tokio"] }
dirs = "6.0"
tauri-plugin-autostart = "2"
