<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e0033"/>
      <stop offset="50%" stop-color="#0d001a"/>
      <stop offset="100%" stop-color="#2a004d"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Outer glow ring -->
  <rect x="40" y="40" width="432" height="432" rx="90" fill="none" stroke="url(#wave)" stroke-width="2" opacity="0.3"/>

  <!-- Letter A -->
  <g transform="translate(256,180)">
    <path d="M-70,120 L0,-80 L70,120" fill="none" stroke="url(#a)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-40" y1="50" x2="40" y2="50" stroke="url(#a)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Music note -->
  <g transform="translate(285,260)" fill="url(#note)">
    <ellipse cx="-15" cy="55" rx="20" ry="16"/>
    <rect x="5" y="-20" width="6" height="75"/>
    <ellipse cx="40" cy="70" rx="20" ry="16"/>
    <rect x="5" y="-40" width="6" height="50" transform="rotate(-20, 5, -20)"/>
  </g>

  <!-- Waveform bars -->
  <g transform="translate(256,380)" fill="url(#wave)">
    <rect x="-80" y="-40" width="6" height="40" rx="3"/>
    <rect x="-64" y="-55" width="6" height="55" rx="3"/>
    <rect x="-48" y="-25" width="6" height="25" rx="3"/>
    <rect x="-32" y="-65" width="6" height="65" rx="3"/>
    <rect x="-16" y="-35" width="6" height="35" rx="3"/>
    <rect x="0" y="-70" width="6" height="70" rx="3"/>
    <rect x="16" y="-40" width="6" height="40" rx="3"/>
    <rect x="32" y="-60" width="6" height="60" rx="3"/>
    <rect x="48" y="-20" width="6" height="20" rx="3"/>
    <rect x="64" y="-50" width="6" height="50" rx="3"/>
    <rect x="80" y="-35" width="6" height="35" rx="3"/>
  </g>
</svg>
