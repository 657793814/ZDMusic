<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient — deep dark with subtle purple tint -->
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1a0625"/>
      <stop offset="40%" stop-color="#0f011c"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </linearGradient>

    <!-- Primary accent — purple → pink flow -->
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Secondary accent — teal accent for depth -->
    <linearGradient id="secondary" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Subtle glow behind the note -->
    <radialGradient id="glow" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="250" r="200" fill="url(#glow)"/>

  <!-- === Beamed eighth notes (double note) === -->
  <g transform="translate(256, 262)">

    <!-- Left note head -->
    <ellipse cx="-48" cy="54" rx="32" ry="22" fill="url(#primary)"
             transform="rotate(-18, -48, 54)"/>

    <!-- Left stem -->
    <rect x="-16" y="-82" width="9" height="138" rx="4.5" fill="url(#primary)"
          transform="rotate(-18, -16, -82)"/>

    <!-- Right note head -->
    <ellipse cx="50" cy="54" rx="32" ry="22" fill="url(#secondary)"
             transform="rotate(-18, 50, 54)"/>

    <!-- Right stem -->
    <rect x="16" y="-96" width="9" height="152" rx="4.5" fill="url(#secondary)"
          transform="rotate(-18, 16, -96)"/>

    <!-- Beam connecting the two stems -->
    <rect x="-55" y="-98" width="110" height="16" rx="8" fill="url(#primary)"
          transform="rotate(-18, 0, -98)"/>

    <!-- Subtle highlight on beam -->
    <rect x="-52" y="-96" width="104" height="4" rx="2" fill="#ffffff" opacity="0.12"
          transform="rotate(-18, 0, -98)"/>

  </g>

  <!-- Thin decorative ring — adds polish -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#primary)" stroke-width="1.5" opacity="0.12"/>

  <!-- Corner rings for extra refinement -->
  <circle cx="108" cy="108" r="24" fill="none" stroke="url(#primary)" stroke-width="1" opacity="0.08"/>
  <circle cx="404" cy="404" r="24" fill="none" stroke="url(#secondary)" stroke-width="1" opacity="0.08"/>
</svg>
