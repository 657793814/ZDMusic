<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="卓动悦听 · 应用图标">
  <title>卓动悦听 · 应用图标（声波唱片）</title>
  <desc>深墨色底 + 青绿唱片沟槽环 + 青绿/暖金声波柱。macOS 图标网格：824×824 圆角方块，四周 100 安全边距。</desc>

  <defs>
    <!-- 背景：深墨色，左上略亮，模拟 macOS 统一光源 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19222b"/>
      <stop offset="0.45" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#06080b"/>
    </linearGradient>

    <!-- 左上高光（只提亮一点，避免整块发灰） -->
    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#edf1f4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#edf1f4" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部青绿环境光 -->
    <radialGradient id="glow" cx="0.5" cy="0.66" r="0.55">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#00F5D4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>

    <!-- 唱片盘面：比背景更沉，让青绿环与声波柱跳出来 -->
    <radialGradient id="disc" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#0f161d"/>
      <stop offset="0.7" stop-color="#080c10"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>

    <!-- 主强调色环：青绿，左上最亮 -->
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="300" y1="284" x2="728" y2="748">
      <stop offset="0" stop-color="#7bfff2"/>
      <stop offset="0.35" stop-color="#00F5D4"/>
      <stop offset="0.8" stop-color="#00cfb4"/>
      <stop offset="1" stop-color="#00a68e"/>
    </linearGradient>

    <!-- 声波柱：青绿渐变 -->
    <linearGradient id="barCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6fff7"/>
      <stop offset="0.45" stop-color="#2bf7dd"/>
      <stop offset="1" stop-color="#00c7af"/>
    </linearGradient>

    <!-- 中心声波柱：暖金渐变 -->
    <linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.45" stop-color="#f4d28a"/>
      <stop offset="1" stop-color="#dfaf62"/>
    </linearGradient>

    <!-- 中心暖金柔光 -->
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4d28a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f4d28a" stop-opacity="0"/>
    </radialGradient>

    <!-- 圆角方块裁切 -->
    <clipPath id="bodyClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- 图层 1：深色圆角底 -->
  <g id="layer-background">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <g clip-path="url(#bodyClip)">
      <circle cx="390" cy="270" r="520" fill="url(#sheen)"/>
      <circle cx="512" cy="680" r="470" fill="url(#glow)"/>
    </g>
  </g>

  <!-- 图层 2：唱片盘面 + 细沟槽 -->
  <g id="layer-disc">
    <circle cx="512" cy="512" r="252" fill="url(#disc)"/>
    <circle cx="512" cy="512" r="238" fill="none" stroke="#edf1f4" stroke-opacity="0.06" stroke-width="3"/>
    <circle cx="512" cy="512" r="214" fill="none" stroke="#edf1f4" stroke-opacity="0.05" stroke-width="2.5"/>
  </g>

  <!-- 图层 3：青绿主环（唱片沟槽 / 声波轨道） -->
  <g id="layer-ring">
    <circle cx="512" cy="512" r="288" fill="none" stroke="url(#ring)" stroke-width="68"/>
    <!-- 左上镜面高光 -->
    <circle cx="512" cy="512" r="288" fill="none" stroke="#f2fffd" stroke-opacity="0.28"
            stroke-width="9" stroke-linecap="round" stroke-dasharray="250 1559"
            transform="rotate(-160 512 512)"/>
  </g>

  <!-- 图层 4：声波柱（5 根胶囊，中心暖金） -->
  <g id="layer-waveform">
    <ellipse cx="512" cy="512" rx="132" ry="240" fill="url(#goldGlow)"/>
    <g fill="url(#barCyan)">
      <rect x="282" y="414" width="64" height="196" rx="32"/>
      <rect x="381" y="370" width="64" height="284" rx="32"/>
      <rect x="579" y="370" width="64" height="284" rx="32"/>
      <rect x="678" y="414" width="64" height="196" rx="32"/>
    </g>
    <rect x="480" y="326" width="64" height="372" rx="32" fill="url(#barGold)"/>
  </g>

  <!-- 图层 5：边缘内描边，增强与壁纸的分隔 -->
  <g id="layer-rim">
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5"
          fill="none" stroke="#edf1f4" stroke-opacity="0.12" stroke-width="3"/>
  </g>
</svg>
