<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>卓动悦听</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      transition: opacity 1s ease;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a855f7, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
    }
    .dots {
      display: inline-flex;
      gap: 8px;
    }
    .dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b5cf6;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #666;
    }
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      padding: 8px 24px;
      border-radius: 20px;
      border: 1px solid #8b5cf6;
      background: transparent;
      color: #a855f7;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: rgba(139, 92, 246, 0.15);
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="title">卓动悦听</div>
    <div class="dots" id="dots">
      <span></span><span></span><span></span>
    </div>
    <div class="status" id="status">正在启动服务器...</div>
    <div class="error" id="error"></div>
    <button class="retry-btn" id="retryBtn" onclick="location.reload()">重试</button>
  </div>
  <script>
    let attempt = 0;
    const maxAttempts = 30;
    const status = document.getElementById('status');
    const error = document.getElementById('error');

    function tryConnect() {
      attempt++;
      status.textContent = `正在启动服务器... (${attempt}/${maxAttempts})`;

      fetch('http://localhost:3000/api/health', { signal: AbortSignal.timeout(3000) })
        .then(r => r.json())
        .then(d => {
          if (d.ok) {
            window.location.href = 'http://localhost:3000';
          } else {
            retry();
          }
        })
        .catch(() => retry());
    }

    function retry() {
      if (attempt >= maxAttempts) {
        document.getElementById('dots').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        error.style.display = 'block';
        error.textContent = '⚠️ 服务器启动失败，请确保 Node.js 已安装后重启应用。';
        document.getElementById('retryBtn').style.display = 'inline-block';
        return;
      }
      setTimeout(tryConnect, 1000);
    }

    // Start checking after a brief delay
    setTimeout(tryConnect, 1500);
  </script>
</body>
</html>
